experiment:
  name: step3_fxlms_mismatch
  seed: 42

signal:
  sample_rate_hz: 2000
  duration_s: 4.0
  tones:
    - frequency_hz: 80.0
      amplitude: 0.7
    - frequency_hz: 120.0
      amplitude: 0.4
    - frequency_hz: 160.0
      amplitude: 0.2
  white_noise_std: 0.03

plant:
  primary_taps: [0.80, 0.00, 0.15, 0.00, -0.08, 0.00, 0.04]
  secondary_taps: [0.70, 0.00, 0.20, 0.00, -0.05]
  secondary_delay_samples: 2

controller:
  type: fxlms
  length: 32
  step_size: 0.005
  estimated_secondary_taps: [0.66, 0.00, 0.23, 0.00, -0.03]
  estimated_secondary_delay_samples: 2

evaluation:
  transient_s: 0.5

output:
  directory: results/step3_fxlms_mismatch
  figure_directory: docs/figures
  save_figures: true
  show_figures: false

safety:
  max_weight_norm: 100.0
  max_abs_residual: 10.0