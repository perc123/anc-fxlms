experiment:
  name: step3_causality_sweep

signal:
  sample_rate_hz: 2000
  duration_s: 4.0
  tones: []
  white_noise_std: 1.0

sweep:
  seeds: [42, 43, 44, 45, 46]
  primary_delay_samples: [0, 1, 2, 3, 4, 6]
  processing_delay_samples: 0

plant:
  primary_taps: [0.80, 0.00, 0.15, 0.00, -0.08, 0.00, 0.04]
  secondary_taps: [0.70, 0.00, 0.20, 0.00, -0.05]

controller:
  length: 32
  step_size: 0.005

evaluation:
  transient_s: 0.5
  steady_state_fraction: 0.2

safety:
  max_weight_norm: 100.0
  max_abs_residual: 10.0

output:
  directory: results/step3_causality_sweep
  figure_directory: docs/figures
  save_figures: true