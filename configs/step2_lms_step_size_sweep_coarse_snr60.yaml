experiment:
  name: step2_lms_step_size_sweep_coarse_snr60
  sample_rate_hz: 2000
  duration_s: 4.0
  seeds: [42, 43, 44, 45, 46]

signal:
  standard_deviation: 0.5

plant:
  primary_taps: [0.80, 0.0, 0.15, 0.0, -0.08, 0.0, 0.04]

controller:
  filter_length: 32
  step_sizes:
    - 0.001
    - 0.002
    - 0.005
    - 0.01
    - 0.02
    - 0.05
    - 0.10
    - 0.15
    - 0.20
    - 0.23

measurement_noise:
  snr_db: 60.0
  floor_margin_db: 3.0
  
safety:
  max_weight_norm: 10.0
  max_abs_error: 10.0

evaluation:
  transient_duration_s: 0.5