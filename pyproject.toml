[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anc-fxlms"
version = "0.1.0"
description = "A reproducible active noise cancellation DSP portfolio project"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy==2.2.6",
    "matplotlib==3.10.3",
    "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
]

[tool.setuptools.packages.find]
include = ["anc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
